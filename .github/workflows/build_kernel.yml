name: Cannon KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      ksu_source:
        description: Latest official legacy + stable Manager, or known-good pinned versions
        required: true
        type: choice
        default: latest
        options:
          - latest
          - pinned
      build_stock:
        description: Also build the unmodified stock kernel
        required: true
        type: boolean
        default: false
      publish_release:
        description: Publish verified outputs to a GitHub Release
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cannon-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      WORK_DIR: ${{ github.workspace }}/work
      DIST_DIR: ${{ github.workspace }}/dist
      CCACHE_DIR: ${{ github.workspace }}/work/.ccache
      KSU_SOURCE_MODE: ${{ inputs.ksu_source }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc binutils bison build-essential ccache curl flex git gh \
            libelf-dev libssl-dev libncurses-dev libtinfo5 make \
            python3 rsync shellcheck unzip xz-utils zip

      - name: Validate scripts
        run: |
          for script in build.sh scripts/*.sh; do bash -n "$script"; done
          shellcheck -x -P SCRIPTDIR build.sh scripts/common.sh scripts/prepare.sh
          python3 -m unittest discover -s tests -v

      - name: Restore toolchains
        id: toolchains
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK_DIR }}/toolchains
          key: cannon-toolchains-${{ runner.os }}-${{ runner.arch }}-v3-${{ hashFiles('sources.env', 'scripts/prepare.sh') }}
          restore-keys: |
            cannon-toolchains-${{ runner.os }}-${{ runner.arch }}-v3-

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: cannon-ccache-${{ runner.os }}-${{ hashFiles('sources.env') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cannon-ccache-${{ runner.os }}-${{ hashFiles('sources.env') }}-
            cannon-ccache-${{ runner.os }}-

      - name: Resolve KSU versions and prepare sources/toolchains
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prepare.sh 2>&1 | tee prepare.log

      - name: Save toolchains
        if: steps.toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK_DIR }}/toolchains
          key: ${{ steps.toolchains.outputs.cache-primary-key }}

      - name: Build stock kernel (optional)
        if: inputs.build_stock
        run: bash build.sh stock

      - name: Build KernelSU-Next legacy (built-in, manual hooks)
        run: bash build.sh ksu

      - name: Verify outputs and prepare release notes
        id: outputs
        run: |
          test -s dist/Cannon-KernelSU-Next-legacy-built-in-by-GinHalion.zip
          cp sources.env dist/sources.env
          cp patches/cannon-ksu-manual-hooks.patch dist/manual-hooks.patch
          (
            cd dist
            sha256sum -- *.zip *.apk *-build-info.txt sources.env resolved-sources.env resolved-sources.json manual-hooks.patch > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          tag="cannon-$(date -u +'%Y%m%d-%H%M%S')-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          source dist/resolved-sources.env
          {
            echo 'Redmi Note 9 5G (cannon/cannong), Linux 4.14.336'
            echo
            echo 'KernelSU-Next legacy: CONFIG_KSU=y, manual hooks, built into Image.gz (not LKM).'
            echo "Source mode: $KSU_SOURCE_MODE. Driver commit: $KSU_COMMIT."
            echo "Manager: official KernelSU-Next $MANAGER_VERSION; APK SHA-256 verified before build."
            echo "Driver/Manager UAPI: $KSU_UAPI_VERSION / $MANAGER_UAPI_VERSION."
            echo 'Includes resolved source snapshots, the hook patch, build metadata, and SHA256SUMS.'
            echo 'Build verification does not replace testing on the target ROM. Back up the original boot image before flashing.'
            echo
            cat dist/ksu-build-info.txt
          } > dist/release-notes.txt
          cat dist/release-notes.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified outputs
        uses: actions/upload-artifact@v4
        with:
          name: Cannon-KernelSU-Next-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*.zip
            dist/*.apk
            dist/*-build-info.txt
            dist/SHA256SUMS
            dist/sources.env
            dist/resolved-sources.env
            dist/resolved-sources.json
            dist/manual-hooks.patch
            dist/release-notes.txt

      - name: Publish GitHub Release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.outputs.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Cannon KernelSU-Next legacy - $RELEASE_TAG" \
            --notes-file dist/release-notes.txt \
            dist/*.zip dist/*.apk dist/*-build-info.txt \
            dist/SHA256SUMS dist/sources.env dist/resolved-sources.env \
            dist/resolved-sources.json dist/manual-hooks.patch

      - name: Save compiler cache even after a failed build
        if: always() && steps.ccache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cannon-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
          path: |
            prepare.log
            dist/logs/
            dist/resolved-sources.*
            ${{ env.WORK_DIR }}/out-*/.config
